name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
        splits: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
            - name: Start Toolshop app in Docker
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git toolshop-app
          cd toolshop-app
          docker compose -f docker-compose.yml up -d
          until curl -s -o /dev/null http://localhost:8091; do sleep 5; done
          for i in 1 2 3 4 5 6; do
            docker compose -f docker-compose.yml exec -T laravel-api php artisan migrate:fresh --seed && break
            sleep 10
          done
          until curl -s -o /dev/null http://localhost:4200; do sleep 5; done
        run: playwright install --with-deps chromium

            - name: Run Playwright tests
        run: pytest -c pytest-ci.ini --base-url http://localhost:4200 --splits ${{ matrix.splits }} --group ${{ matrix.group }}

      - name: Upload HTML report and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: reports/
          retention-days: 14

      - name: Upload traces, screenshots, videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}
          path: test-results/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: shard-reports
          pattern: playwright-report-*

      - name: Merge JUnit files
        run: python scripts/merge_junit.py shard-reports reports/junit-merged.xml

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14