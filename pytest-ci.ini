[pytest]
addopts =
    --base-url https://practicesoftwaretesting.com
    --strict-markers
    --reruns 2
    --reruns-delay 1
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
    --tracing retain-on-failure
    --screenshot only-on-failure
    --video retain-on-failure
markers =
    only: focus marker - запрещён в CI