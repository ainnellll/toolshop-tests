name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
        splits: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start Toolshop app in Docker
        env:
          DISABLE_LOGGING: "false"
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git toolshop-app
          cd toolshop-app
          docker compose -f docker-compose.yml up -d --force-recreate
          sleep 30
          docker compose -f docker-compose.yml exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready"; break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml exec -T laravel-api php artisan migrate:refresh --seed
          curl -fsS http://localhost:8091/status
          echo "--- PRODUCTS CHECK ---"
          curl -sS -w "\nHTTP %{http_code}\n" "http://localhost:8091/products?page=0" | head -c 1200 || true
          docker compose -f docker-compose.yml exec -T laravel-api sh -c "tail -n 40 storage/logs/laravel.log 2>/dev/null || echo no-laravel-log" || true
          echo "--- END PRODUCTS CHECK ---"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready"; exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml logs angular-ui
          exit 1

      - name: Run Playwright tests
        run: pytest -c pytest-ci.ini --base-url http://localhost:4200 --splits ${{ matrix.splits }} --group ${{ matrix.group }}

      - name: Upload HTML report and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: reports/
          retention-days: 14

      - name: Upload traces, screenshots, videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}
          path: test-results/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: shard-reports
          pattern: playwright-report-*

      - name: Merge JUnit files
        run: python scripts/merge_junit.py shard-reports reports/junit-merged.xml

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14